# guardrails configuration — flat schema only:
#   `key: value` scalars and two-space `- item` lists.
# Parsed by .guardrails/scripts/lib.sh with awk; do not nest deeper.
#
# The schema is CLOSED and validated before any gate runs. Every rule below
# exists because breaking it made a key invisible to the reader, which silently
# disabled the gate that key configures while the run still exited 0:
#
#   * a key must be `identifier:` at column one — not `strict-paths:`, not
#     ` strict_paths:`, not `strict_paths :`;
#   * a key must be one of those below. Comment one out to disable it — and if
#     it is a list key, comment its `  - items` out too, or they are orphaned
#     and rejected. Never misspell one;
#   * list items are indented (`  - src`), never at column zero;
#   * the file must be plain UTF-8 with no byte-order mark;
#   * `id_prefixes` must name at least one prefix with a traceability gate:
#     REQ, HAZ, RC, SDD, LLR, PR. Others may be listed alongside them and are
#     covered by DANGLING-REF and DUPLICATE-ID, just not by a gate of their
#     own. With none of the six, only those checks remain;
#   * a declared prefix needs the documents its gates READ, which is not always
#     the document it is defined in: `RC` needs `doc_srs`, because
#     UNIMPLEMENTED-CONTROL looks for a REQ that implements each control;
#   * a declared prefix also needs the one document it may be DEFINED in —
#     REQ `doc_srs`, HAZ/RC `doc_rmf`, SDD/LLR `doc_sad`, PR `doc_problems`.
#     This one is not about a key the reader cannot see: MISPLACED-ITEM reads
#     that document to decide whether each item is filed where the gate keyed
#     on it can parse the item's block. `RC` therefore needs BOTH doc_srs and
#     doc_rmf. The rejection happens before any gate runs, so the alternative
#     it forecloses is never observed: were the key merely absent, the gate
#     would not be skipped, it would condemn every item of the prefix once
#     each while naming a key that was never set.
#
# NOT VALIDATED, and listed apart from the rules above for that reason: a
# `doc_*` value pointing inside `.guardrails/scripts/`, inside `.git/`, at a
# gitignored path, or through a symlink leaving the repository is ACCEPTED.
# `checked:` counts its items as zero and finalization renames a draft ledger
# there without minting anything. Whether anything warns you first depends on
# the location, on whether git tracks or ignores the file, and on whether
# finalization has already run: some combinations are silent throughout,
# others raise a complaint that names no cause and that finalization removes.
# Do not do it. (A symlink to a directory INSIDE the repository is scanned
# normally, under the target real path.)
#
# A trailing ` # comment` after a value is stripped, for EVERY key — paths and
# path-list entries as well as commands. It cannot be escaped, so any value
# whose own whitespace-delimited token starts with `#` is truncated silently.
# A directory literally named `docs/req #1` cannot be configured here.
#
# A duplicate key, or a second list block for the same key, is accepted and the
# later one ignored. Do not rely on overriding a key by repeating it.
guardrails_version: 0.1.0

# IEC 62304 software safety class: A, B, or C. Set by /ratchet.
# Per-item overrides: document them in the SAD next to the SDD item.
safety_class: TBD

# ID prefixes managed by the check/finalize scripts.
# LLR = low-level requirements (design data, live in the SAD).
# PR  = problem reports (docs/problems/log.md).
id_prefixes: REQ HAZ RC SDD LLR PR

# Canonical document locations.
doc_srs: docs/requirements
doc_rmf: docs/risk
doc_sad: docs/architecture
doc_soup: docs/architecture/soup.md
doc_problems: docs/problems

# Paths where traceability is enforced. On retrofit projects this list
# starts small and grows as untraced code is brought under guardrails.
strict_paths:
  - src

# Paths searched for `verifies:` test annotations.
test_paths:
  - tests

# Commands merge-change and verify-before-merge must run and pass.
verify_commands:
  - make test

# Optional: structural-coverage report command, judged against the class
# target (A: none required, B: statement, C: statement + decision).
# Uncomment and adapt to enable the coverage gate:
# coverage_command:
#   - make coverage
